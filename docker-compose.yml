version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: cartkb
      POSTGRES_USER: cartkb
      POSTGRES_PASSWORD: cartkbpass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build: ./server
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://cartkb:cartkbpass@db:5432/cartkb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace_this_with_a_strong_secret
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app

volumes:
  db-data:
