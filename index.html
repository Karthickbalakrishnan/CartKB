    :root{font-family:Inter,system-ui,sans-serif;color:#14233b;background:#eef4fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef4fa}.app{width:min(100%,520px);height:100dvh;min-height:560px;margin:auto;background:#f6f9fc;display:flex;flex-direction:column;box-shadow:0 10px 50px #09264b24;position:relative;overflow:hidden}.topbar{background:#0071dc;color:white;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo{width:36px;height:36px;border-radius:12px;background:#ffc220;color:#041e42;display:grid;place-items:center}.actions{display:flex;gap:8px}.btn{border:0;border-radius:999px;padding:9px 13px;font:700 12px inherit;cursor:pointer}.top-action{background:#ffffff24;color:#fff;border:1px solid #ffffff55}.main{flex:1;overflow:auto;padding:16px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #e1e7ee;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.tab{border:0;background:transparent;color:#7a8798;display:grid;gap:4px;justify-items:center;font:600 10px Inter;cursor:pointer}.tab i{font-size:17px}.tab.active{color:#0071dc}.hero{background:linear-gradient(120deg,#ffcf3d,#ffa900);padding:20px;border-radius:22px;margin:12px 0 18px;color:#152943}.hero h2{margin:7px 0;font-size:22px}.hero p{margin:0;font-size:12px}.eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:15px;font-weight:800;margin:18px 0 10px}.muted{color:#748196;font-size:12px}.card{background:white;border:1px solid #e1e7ee;border-radius:18px;padding:14px;margin-bottom:10px}.launch{display:grid;grid-template-columns:1fr 1fr;gap:10px}.launch button{background:white;border:1px solid #e1e7ee;border-radius:18px;padding:18px 10px;color:#11284a;font:700 13px Inter;cursor:pointer}.launch i{display:block;color:#0071dc;font-size:22px;margin-bottom:9px}.search{width:100%;padding:12px 14px;border:1px solid #cbd6e2;border-radius:14px;font:13px Inter;outline-color:#0071dc;background:white}.chips{display:flex;overflow:auto;gap:7px;padding:12px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #dfe5ec;background:#fff;color:#34445a;border-radius:999px;padding:7px 11px;font:700 10px Inter;cursor:pointer}.chip.selected{background:#0071dc;color:white;border-color:#0071dc}.product{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}.product .pic{width:56px;height:56px;background:#eaf2f8;border-radius:13px;display:grid;place-items:center;color:#0071dc;font-size:21px}.product-name{font-size:12px;font-weight:800;line-height:1.4}.product-meta{font-size:10px;color:#78869a;margin-top:4px}.price{font-size:13px;font-weight:800;text-align:right}.add{display:block;margin-top:7px;background:#ffc220;color:#172840;border:0;border-radius:999px;padding:7px 11px;font:800 10px Inter;cursor:pointer}.empty{text-align:center;padding:35px 20px}.empty i{color:#0071dc;font-size:28px;margin-bottom:12px}.modal{position:absolute;inset:0;background:#07172cb8;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{width:100%;max-width:440px;max-height:92%;overflow:auto;background:white;border-radius:22px;padding:19px}.dialog h2{font-size:18px;margin:0 0 6px}.dialog textarea{width:100%;resize:vertical;min-height:130px;border:1px solid #ccd5e0;border-radius:12px;padding:11px;font:13px Inter}.dialog .btn{padding:12px}.primary{background:#ffc220;color:#14233b}.secondary{background:#eef2f6;color:#41516a}.hidden{display:none!important}.preview{max-height:170px;max-width:100%;display:block;margin:12px auto;border-radius:12px;object-fit:contain}.alert{background:#fff0f0;color:#a52323;border-radius:10px;padding:10px;font-size:12px}.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#071d3c;color:white;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:700;z-index:10;white-space:nowrap;box-shadow:0 4px 20px #0003}.store{display:flex;align-items:center;gap:12px}.store-icon{width:42px;height:42px;border-radius:13px;background:#eaf3ff;color:#0071dc;display:grid;place-items:center}.badge{background:#e8f4ff;color:#0065c7;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}

<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="logo"><i class="fa-solid fa-cart-shopping"></i></div><div>Cart<span style="color:#ffc220">KB</span><div style="font-size:9px;font-weight:500;opacity:.8">Smart shopping • Chennai</div></div></div><div class="actions"><button class="btn top-action" data-action="open-import"><i class="fa-regular fa-image"></i> Upload list</button><button class="btn top-action" data-action="language">EN</button></div></header>

<script>
'use strict';
const groups=[
 {category:'Fruits',dept:'Fruits',aisle:'Aisle 1A',base:35,names:['Alphonso Mango','Robusta Banana','Washington Apple','Navel Orange','Green Grapes','Black Grapes','Pomegranate','Guava','Papaya','Sweet Lime'],brands:['Farm Fresh','Nature Basket','Daily Harvest','Orchard Select','Local Market']},
 {category:'Fruits',dept:'Fruits',aisle:'Aisle 1B',base:45,names:['Dragon Fruit','Kiwi Fruit','Pear','Pineapple','Watermelon','Muskmelon','Strawberry','Blueberry','Jamun','Seasonal Chikoo'],brands:['Farm Fresh','Nature Basket','Daily Harvest','Orchard Select','Local Market']},
 {category:'Veggies',dept:'Veggies',aisle:'Aisle 1C',base:20,names:['Tomato','Red Onion','Potato','Carrot','Green Capsicum','Cucumber','Cauliflower','Cabbage','Brinjal','Green Peas'],brands:['Farm Fresh','Nature Basket','Daily Harvest','Local Market','Fresh Fields']},
 {category:'Veggies',dept:'Veggies',aisle:'Aisle 1D',base:18,names:['Spinach','Coriander Leaves','Curry Leaves','Drumstick','Okra','Bottle Gourd','Bitter Gourd','Beetroot','Sweet Potato','Green Beans'],brands:['Farm Fresh','Nature Basket','Daily Harvest','Local Market','Fresh Fields']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2A',base:65,names:['Sona Masoori Rice','Basmati Rice','Whole Wheat Atta','Toor Dal','Moong Dal','Chana Dal','Rajma','Poha','Rava Sooji','Millet Mix'],brands:['Tata Sampann','Aashirvaad','Fortune','24 Mantra','Kitchen Select']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2B',base:80,names:['Sunflower Oil','Groundnut Oil','Coconut Oil','Gingelly Oil','Olive Oil','Turmeric Powder','Chilli Powder','Sambar Powder','Garam Masala','Black Pepper'],brands:['Fortune','Aachi','Tata Sampann','Organic Tattva','Kitchen Select']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2C',base:45,names:['Apple Cider Vinegar','Tomato Ketchup','Coconut Milk','Peanut Butter','Honey','Instant Coffee','Tea Leaves','Jaggery Powder','Pasta Sauce','Pickle'],brands:['Tata Sampann','Aachi','Dabur','Organic Tattva','Kitchen Select']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2D',base:32,names:['Toned Milk','Curd','Paneer','Salted Butter','Cheddar Cheese','Fresh Cream','Buttermilk','Greek Yogurt','Ghee','Condensed Milk'],brands:['Amul','Aavin','Heritage','Milky Mist','Daily Fresh']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2E',base:25,names:['Sandwich Bread','Whole Wheat Bread','Burger Buns','Pav Buns','Rusk Toast','Croissant','Fruit Cake','Multigrain Loaf','Pita Bread','Garlic Bread'],brands:['Modern','Harvest Gold','Britannia','The Baker','Daily Fresh']},
 {category:'Grocery & Kitchen',dept:'Grocery & Kitchen',aisle:'Aisle 2F',base:50,names:['Breakfast Oats','Corn Flakes','Muesli','Wheat Flakes','Granola','Chia Seeds','Flax Seeds','Almond Flour','Coconut Flour','Protein Pancake Mix'],brands:['Kellogg’s','Quaker','Yoga Bar','True Elements','Kitchen Select']},
 {category:'Snacks & Drinks',dept:'Snacks & Drinks',aisle:'Aisle 3A',base:20,names:['Masala Potato Chips','Salted Potato Chips','Banana Chips','Kadalai Mittai','Murukku','Mixture Namkeen','Roasted Peanuts','Popcorn','Nacho Chips','Chocolate Wafer'],brands:['Aachi','Haldiram’s','Bingo!','Too Yumm!','Snack House']},
 {category:'Snacks & Drinks',dept:'Snacks & Drinks',aisle:'Aisle 3B',base:25,names:['Orange Juice','Mango Drink','Lime Soda','Sparkling Water','Coconut Water','Iced Tea','Cola Drink','Energy Drink','Apple Juice','Filter Coffee Can'],brands:['Paper Boat','Tropicana','Real','Campa','Daily Refresh']},
 {category:'Snacks & Drinks',dept:'Snacks & Drinks',aisle:'Aisle 3C',base:35,names:['Dark Chocolate','Milk Chocolate','Cashew Cookies','Oat Cookies','Digestive Biscuits','Cream Biscuits','Almonds','Cashews','Pistachios','Trail Mix'],brands:['Amul','Britannia','Sunfeast','Cadbury','Snack House']},
 {category:'Fashion & Lifestyle',dept:'Fashion & Lifestyle',aisle:'Aisle 4A',base:199,names:['Cotton Crew T-Shirt','Polo T-Shirt','Casual Shirt','Leggings','Cotton Kurta','Denim Jeans','Sleepwear Set','Sports Shorts','Cotton Socks','Everyday Scarf'],brands:['Style Street','Urban Loom','Everyday Wear','Indi Threads','Active Life']},
 {category:'Fashion & Lifestyle',dept:'Fashion & Lifestyle',aisle:'Aisle 4B',base:149,names:['Reusable Tote Bag','Travel Pouch','Cotton Hand Towel','Water Bottle','Lunch Bag','Compact Umbrella','Wallet','Hair Band Set','Sunglasses','Travel Organizer'],brands:['Style Street','Urban Loom','Everyday Wear','Indi Threads','Active Life']},
 {category:'Beauty & Personal Care',dept:'Beauty & Personal Care',aisle:'Aisle 5A',base:55,names:['Moisturizing Soap','Neem Bathing Soap','Shampoo','Conditioner','Body Lotion','Face Wash','Toothpaste','Toothbrush','Hand Wash','Deodorant'],brands:['Himalaya','Dove','Pond’s','Dabur','Personal Care Co']},
 {category:'Beauty & Personal Care',dept:'Beauty & Personal Care',aisle:'Aisle 5B',base:75,names:['Sunscreen Lotion','Aloe Vera Gel','Lip Balm','Face Moisturizer','Hair Oil','Hair Serum','Clay Face Mask','Micellar Cleanser','Talcum Powder','Rose Water Toner'],brands:['Himalaya','Dove','Pond’s','Dabur','Personal Care Co']},
 {category:'Household Essentials',dept:'Household Essentials',aisle:'Aisle 6A',base:65,names:['Laundry Detergent','Dishwash Liquid','Floor Cleaner','Bathroom Cleaner','Glass Cleaner','Fabric Softener','Scrub Sponge','Garbage Bags','Paper Towels','Toilet Cleaner'],brands:['Vim','Surf Excel','Harpic','Lizol','Home Essentials']},
 {category:'Household Essentials',dept:'Household Essentials',aisle:'Aisle 6B',base:40,names:['LED Bulb','Storage Container','Kitchen Foil Roll','Food Storage Bags','Microfiber Cloth','Mop Refill','Laundry Basket','Room Freshener','Mosquito Repellent','Scented Candle'],brands:['Home Essentials','Bright Living','Godrej','Odonil','Everyday Home']},
 {category:'Hobbies & Interests',dept:'Hobbies & Interests',aisle:'Aisle 7A',base:60,names:['Watercolor Set','Sketchbook','Color Pencil Set','Acrylic Paint Set','Craft Paper Pack','Knitting Yarn','Gardening Gloves','Seed Starter Kit','Yoga Mat','Resistance Bands'],brands:['Creative Corner','Art House','Garden Life','Active Life','Hobby Works']}
];
const packs=[['250g / 250ml',.65],['500g / 500ml',1],['1kg / 1L',1.8],['Family size',2.7],['Value size',4.2]];
const categories=['Fruits','Veggies','Grocery & Kitchen','Snacks & Drinks','Fashion & Lifestyle','Beauty & Personal Care','Household Essentials','Hobbies & Interests'];
const collections=['Festival Specials','Explore',"Today’s Deals",'Featured','Fresh At','Offers for You','Buy Again','Season’s Best','Blockbuster Deals',...categories];
const catalog=[];let id=1;
groups.forEach((g,gi)=>g.names.forEach((n,ni)=>packs.forEach(([label,m],pi)=>{const price=Math.max(10,Math.round(g.base*m));let tags=['Explore',g.category];if(id%4===0)tags.push('Featured');if(id%3===0)tags.push('Today’s Deals','Offers for You');if(id%7===0)tags.push('Buy Again');if(id%11===0)tags.push('Blockbuster Deals');if(gi<4){tags.push('Fresh At');if(ni%2===0)tags.push('Season’s Best')}if(/mango|grape|sweet|jamun|oil|ghee|jaggery|rice|masala/i.test(n))tags.push('Festival Specials');catalog.push({id:`p${id++}`,name:`${g.brands[ni%g.brands.length]} ${n} - ${label}`,dept:g.dept,category:g.category,collections:[...new Set(tags)],aisle:g.aisle,bay:`Bay ${(ni%5)+1}`,shelf:['Top Shelf','Middle Shelf','Lower Shelf'][(ni+pi)%3],price,image:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=180&auto=format&fit=crop&q=75'});}))))
let list=[];try{list=JSON.parse(localStorage.getItem('cartkb-shopping-list')||'[]');if(!Array.isArray(list))list=[]}catch{list=[]}
let screen='home',activeCategory='All',query='',modalUrl='',ocrBusy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem('cartkb-shopping-list',JSON.stringify(list))}catch{}}
function toast(msg){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>r.innerHTML='',2200)}
function setScreen(s){screen=s;activeCategory='All';query='';render()}
function addItem(item){list.push({...item,id:`${Date.now()}-${Math.random()}`,collected:false});persist();toast('Added to your shopping list')}
function productCard(p){return `<article class="card product"><div class="pic"><i class="fa-solid fa-basket-shopping"></i></div><div><div class="product-name">${esc(p.name)}</div><div class="product-meta">${esc(p.category)} · ${esc(p.aisle)} · ${esc(p.bay)}</div><div class="product-meta">${esc(p.collections.filter(c=>c!==p.category&&c!=='Explore').slice(0,2).join(' · '))}</div></div><div class="price">₹${p.price}<button class="add" data-add="${p.id}">Add</button></div></article>`}
function filteredProducts(){const q=query.trim().toLocaleLowerCase();return catalog.filter(p=>(activeCategory==='All'||p.category===activeCategory||p.collections.includes(activeCategory))&&(!q||p.name.toLocaleLowerCase().includes(q)||p.category.toLocaleLowerCase().includes(q)||p.collections.some(c=>c.toLocaleLowerCase().includes(q)))).slice(0,60)}
function browseView(home=false){const items=filteredProducts();return `${home?`<div class="row"><div><span class="badge">PRE-RIDE CHECK</span><h2 style="font-size:18px;margin:9px 0 3px">Search & compare products</h2></div><b style="font-size:11px;color:#0071dc">${catalog.length.toLocaleString()} products</b></div>`:`<h2 style="margin:0 0 4px;font-size:18px">Browse catalog</h2><p class="muted">${catalog.length.toLocaleString()} sample products across departments and collections.</p>`}<input id="search" class="search" value="${esc(query)}" placeholder="Search products, departments, or offers…"><div class="chips">${['All',...collections].map(c=>`<button class="chip ${activeCategory===c?'selected':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><p class="muted">Showing ${items.length} matches · ${catalog.length.toLocaleString()} products total</p>${items.length?items.map(productCard).join(''):'<div class="card empty">No products found. Try another search or category.</div>'}`}
function landing(){return `<div class="row"><div><div class="badge">Estimated location</div><div class="muted" style="margin-top:5px">Nanganallur, Chennai</div></div><button class="chip" data-action="location"><i class="fa-solid fa-location-crosshairs"></i> Update</button></div><div class="hero"><span class="eyebrow">Diwali & festive deals</span><h2>Grand festive savings!</h2><p>Discover everyday essentials, fresh picks, and special offers.</p></div><div class="section-title">Start shopping</div><div class="launch"><button data-screen="home-search"><i class="fa-solid fa-magnifying-glass"></i>Search products</button><button data-screen="browse"><i class="fa-solid fa-store"></i>Browse catalog</button><button data-action="open-import"><i class="fa-regular fa-image"></i>Scan a list</button><button data-screen="list"><i class="fa-solid fa-list-check"></i>My shopping list (${list.length})</button></div><div class="section-title">Nearby stores</div>${[['Nilgiris Supermarket','1st Main Road, Nanganallur · 0.4 km'],['Reliance Smart Point','48th Street, Nanganallur · 0.7 km'],['V V Mart','Nanganallur · 0.8 km']].map(([n,a])=>`<div class="card store"><div class="store-icon"><i class="fa-solid fa-shop"></i></div><div style="flex:1"><b style="font-size:12px">${n}</b><div class="muted">${a}</div></div><span class="badge">Open</span></div>`).join('')}`}
function listView(){const total=list.reduce((s,i)=>s+(Number(i.price)||0),0);return `<div class="row"><div><h2 style="margin:0;font-size:18px">Your shopping list</h2><p class="muted">${list.length} items · Estimated ₹${total.toFixed(2)}</p></div><button class="chip" data-action="open-import"><i class="fa-solid fa-camera"></i> Scan list</button></div>${list.length?list.map(i=>`<div class="card product"><div class="pic"><i class="fa-solid fa-basket-shopping"></i></div><div><div class="product-name">${esc(i.name)}</div><div class="product-meta">${esc(i.aisle||'Aisle not assigned')}${i.bay?' · '+esc(i.bay):''}</div>${i.price?`<div class="product-meta">${esc(i.shelf||'')}</div>`:'<div class="product-meta" style="color:#9a6500">Needs identification · price not set</div>'}</div><div class="price">${i.price?'₹'+Number(i.price).toFixed(2):'—'}<button class="add" data-remove="${esc(i.id)}">Remove</button></div></div>`).join('')+`<button class="btn primary" style="width:100%;margin-top:8px" data-screen="navigate">Start aisle navigation</button>`:`<div class="card empty"><i class="fa-solid fa-list-check"></i><h3 style="margin:0 0 5px">Your list is empty</h3><p class="muted">Scan a handwritten list or browse the catalog to add items.</p><button class="btn primary" data-action="open-import">Upload a list image</button><button class="btn secondary" data-screen="browse">Browse products</button></div>`}`}
function checkout(){const total=list.reduce((s,i)=>s+(Number(i.price)||0),0);return `<h2 style="margin:0 0 6px;font-size:18px">Checkout</h2><p class="muted">Review your cart before payment.</p>${list.length?`<div class="card">${list.map(i=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #edf0f3"><span style="font-size:12px">${esc(i.name)}</span><b>₹${Number(i.price||0).toFixed(2)}</b></div>`).join('')}<div class="row" style="padding-top:12px"><b>Total</b><b>₹${total.toFixed(2)}</b></div></div><button class="btn primary" style="width:100%" data-action="pay">Pay with UPI (demo)</button><button class="btn secondary" style="width:100%;margin-top:8px" data-screen="navigate">Scan items</button>`:'<div class="card empty"><p>Your cart is empty.</p><button class="btn primary" data-screen="browse">Browse products</button></div>'}`}
function render(){const main=document.getElementById('main');if(screen==='home')main.innerHTML=landing();else if(screen==='home-search')main.innerHTML=browseView(true);else if(screen==='browse')main.innerHTML=browseView(false);else if(screen==='list')main.innerHTML=listView();else if(screen==='scan')main.innerHTML=checkout();else if(screen==='navigate')main.innerHTML=`<h2 style="margin:0 0 8px;font-size:18px">Aisle navigation</h2><p class="muted">Your route is ready. Follow your list aisle by aisle.</p>${list.length?list.map((i,n)=>`<div class="card row"><div><span class="badge">${esc(i.aisle||'Aisle TBD')}</span><div class="product-name" style="margin-top:8px">${esc(i.name)}</div><div class="product-meta">${esc(i.bay||'')}</div></div><button class="btn ${i.collected?'secondary':'primary'}" data-collected="${esc(i.id)}">${i.collected?'Collected':'Found it'}</button></div>`).join(''):'<p class="muted">Add products to your list to plan a route.</p>'}<button class="btn secondary" data-screen="list">Back to list</button>`;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===({home:'home', 'home-search':'home',browse:'browse',list:'list',scan:'scan',navigate:'list'}[screen])));document.getElementById('modal-root').innerHTML='';}
function openImport(){document.getElementById('modal-root').innerHTML=`<div class="modal" id="import-modal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="ocr-title"><div class="row"><div><h2 id="ocr-title">Scan your shopping list</h2><div class="muted">Upload or photograph a list. Review OCR results before adding them.</div></div><button class="chip" data-action="close-import" aria-label="Close">✕</button></div><label class="muted" style="display:block;margin-top:15px">Choose an image (JPG, PNG, WebP; max 10 MB)</label><input id="image-input" type="file" accept="image/*" capture="environment" style="margin-top:7px;font-size:12px"><img id="image-preview" class="preview hidden" alt="Uploaded shopping list preview"><div id="ocr-status" class="muted" style="margin:10px 0"></div><div id="ocr-error"></div><label for="recognized-items" class="product-name" style="display:block;margin:10px 0 6px">Recognized items — edit before adding</label><textarea id="recognized-items" placeholder="Recognized items appear here. You can also type or correct them."></textarea><p class="muted" style="font-size:10px">Items that do not match the sample catalog are saved without a price so you can identify them in store.</p><div class="row" style="margin-top:12px"><button class="btn secondary" data-action="close-import">Cancel</button><button class="btn primary" data-action="confirm-import">Confirm & add to cart</button></div></section></div>`;document.getElementById('image-input').addEventListener('change',recognizeImage)}
function showOcrError(msg){document.getElementById('ocr-error').innerHTML=`<div class="alert" role="alert">${esc(msg)}</div>`}
async function recognizeImage(e){const file=e.target.files?.[0];if(!file)return;document.getElementById('ocr-error').innerHTML='';if(!file.type.startsWith('image/'))return showOcrError('Choose an image file such as JPG, PNG, or WebP.');if(file.size>10*1024*1024)return showOcrError('This image is larger than 10 MB. Please choose a smaller image.');const preview=document.getElementById('image-preview');if(modalUrl)URL.revokeObjectURL(modalUrl);modalUrl=URL.createObjectURL(file);preview.src=modalUrl;preview.classList.remove('hidden');const status=document.getElementById('ocr-status');status.textContent='Loading text recognition…';ocrBusy=true;try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const worker=await Tesseract.createWorker('eng');const result=await worker.recognize(file);await worker.terminate();const clean=(result.data.text||'').split(/\r?\n/).map(x=>x.replace(/^\s*(?:[-*•▪]|\d+[.)])\s*/,'').trim()).filter(x=>x&&!/^[-_=|.]+$/.test(x)).join('\n');document.getElementById('recognized-items').value=clean;if(!clean)showOcrError('No text was found. Try a clearer, well-lit photo, or type the items below.');status.textContent=clean?'Text recognition complete. Please review and edit the items.':''}catch(err){console.error(err);showOcrError('Text recognition could not complete. Check your connection and try again, or type the items below.');status.textContent=''}finally{ocrBusy=false}}
function closeImport(){if(modalUrl)URL.revokeObjectURL(modalUrl);modalUrl='';document.getElementById('modal-root').innerHTML=''}
function confirmImport(){const lines=[...new Set(document.getElementById('recognized-items').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(!lines.length)return showOcrError('Add at least one item before confirming.');const additions=lines.map(line=>{const q=line.toLocaleLowerCase().replace(/\s+/g,' ');const match=catalog.find(p=>p.name.toLocaleLowerCase()===q)||catalog.find(p=>p.name.toLocaleLowerCase().includes(q)||q.includes(p.name.toLocaleLowerCase().replace(/\s*-\s*.*$/,'')));return match?{name:match.name,variant:match.name.split(' - ').pop(),aisle:match.aisle,bay:match.bay,shelf:match.shelf,price:match.price,image:match.image}:{name:line,variant:'Needs matching in store',aisle:'Aisle not assigned',bay:'',shelf:'',price:0,image:''}});list.push(...additions.map(i=>({...i,id:`${Date.now()}-${Math.random()}`,collected:false})));persist();closeImport();setScreen('list');toast(`${additions.length} item${additions.length===1?'':'s'} added to cart`)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-screen],[data-tab],[data-category],[data-add],[data-remove],[data-collected]');if(!target)return;if(target.dataset.action==='open-import')openImport();else if(target.dataset.action==='close-import'){if(!ocrBusy)closeImport()}else if(target.dataset.action==='confirm-import'){if(!ocrBusy)confirmImport()}else if(target.dataset.action==='location')toast('Location estimate: Nanganallur, Chennai');else if(target.dataset.action==='language')toast('English selected');else if(target.dataset.action==='pay'){toast('Demo payment successful');setScreen('home')}else if(target.dataset.screen)setScreen(target.dataset.screen);else if(target.dataset.tab)setScreen(target.dataset.tab==='home'?'home':target.dataset.tab);else if(target.dataset.category){activeCategory=target.dataset.category;render()}else if(target.dataset.add){const p=catalog.find(p=>p.id===target.dataset.add);if(p)addItem({name:p.name,variant:p.name.split(' - ').pop(),aisle:p.aisle,bay:p.bay,shelf:p.shelf,price:p.price,image:p.image});if(screen==='list')render()}else if(target.dataset.remove){list=list.filter(i=>i.id!==target.dataset.remove);persist();render()}else if(target.dataset.collected){list=list.map(i=>i.id===target.dataset.collected?{...i,collected:!i.collected}:i);persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;query=e.target.value;render();const field=document.getElementById('search');field.focus();field.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ocrBusy)closeImport()});render();
</script>
</body>
</html>
